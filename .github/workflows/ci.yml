name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: better_bracket
          POSTGRES_USER: better_bracket
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U better_bracket"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_ENVIRONMENT: development
      app_baseURL: http://127.0.0.1:8080/
      database_default_hostname: 127.0.0.1
      database_default_username: better_bracket
      database_default_password: ci-only-password
      database_default_database: better_bracket
      PGHOST: 127.0.0.1
      PGUSER: better_bracket
      PGPASSWORD: ci-only-password
      PGDATABASE: better_bracket
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5.12"
          tools: composer:v2.11.0
          extensions: intl, mbstring, pdo_pgsql, pgsql, sqlite3
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - parallel:
          - name: PHP checks
            run: composer check

          - name: JavaScript lint
            run: pnpm run lint

          - name: JavaScript tests
            run: pnpm test

          - name: Build container
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            env:
              DOCKER_BUILD_RECORD_UPLOAD: "false"
            with:
              context: .
              load: true
              push: false
              tags: better-bracket:ci
              # PRs only restore; pushes and manual runs populate the layer cache.
              cache-from: type=gha,scope=better-bracket
              cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=better-bracket,mode=max,timeout=2m,ignore-error=true' || '' }}

      - name: Initialize disposable browser fixtures
        run: |
          php spark migrate --all
          php spark db:seed TournamentSeeder
          pnpm exec e2e-web install chromium --with-deps

      - name: Demonstrate pre-fix regressions independently
        run: |
          for file in app/Controllers/Auth.php app/Controllers/Bracket.php public/assets/js/bracket.js; do
            cp "$file" /tmp/audit-fixed-source
            git show 65fc7a9:"$file" > "$file"
            set +e
            pnpm exec e2e run --output ".e2e/baseline-$(basename "$file")"
            result=$?
            set -e
            cp /tmp/audit-fixed-source "$file"
            if [ "$result" -ne 1 ]; then
              echo "Expected a failing regression for $file, got exit $result"
              exit 1
            fi
          done

      - name: Demonstrate pre-fix concurrent replacement regression
        run: |
          cp app/Models/BracketModel.php /tmp/audit-fixed-model
          git show 65fc7a9:app/Models/BracketModel.php > app/Models/BracketModel.php
          set +e
          vendor/bin/phpunit --filter BracketConcurrencyTest
          result=$?
          set -e
          cp /tmp/audit-fixed-model app/Models/BracketModel.php
          test "$result" -eq 1

      - name: Browser account and picks regression
        run: pnpm exec e2e run

      - name: Upload browser and PHP evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reliability-evidence
          include-hidden-files: true
          path: |
            .e2e/
            build/logs/
            writable/logs/
